server:
  app_name: "Peerly Prod"
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 15s
  shutdown_timeout: 60s
  prefork: false

postgres:
  max_connections: 20
  min_connections: 5
  connection_timeout: 5s
  max_conn_lifetime: 60m
  max_conn_idle_time: 10m
  health_check_period: 30s

logging:
  level: info
  format: json