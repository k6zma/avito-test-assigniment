version: "2"
sql:
  - schema:
      - "migrations"
    queries:
      - "internal/infrastructure/repositories/postgres/queries"
    engine: "postgresql"
    gen:
      go:
        out: "internal/infrastructure/repositories/postgres/generated"
        package: "generated"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_interface: false
        emit_empty_slices: true
        json_tags_case_style: "snake"
